<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WikyFile – Ảnh sang PDF, PDF sang Word, Ghép & Chỉnh sửa PDF</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sapphire: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#1558C9',
              600: '#1047a7',
              700: '#0c357d',
              800: '#1e3a8a',
              900: '#1e3a5f'
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 40%, #f3e8ff 100%);
      color: #0f172a;
    }
    .dark body { background: linear-gradient(135deg, #020617, #0f172a 50%, #111827); color: #e2e8f0; }

    /* Hide legacy widget if still present */
    .wiky-sync,
    [data-widget="wiky-sync"],
    [id*="wiky-sync"],
    [class*="wiky-sync"],
    [id*="AF-HOME-STATS"],
    [class*="af-home-stats"] {
      display: none !important;
    }

    /* Compact AF-HOME-STATS replacement */
    .af-home-stats-shell {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.6);
    }
    .af-home-stats-item {
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 0.9rem;
      padding: 0.7rem 0.55rem;
      text-align: center;
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.03);
    }
    .dark .af-home-stats-item {
      background: rgba(15, 23, 42, 0.64);
      border-color: rgba(96,165,250,.22);
    }
    .af-home-stats-value {
      display: block;
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.2;
      color: #0f172a;
    }
    .dark .af-home-stats-value { color: #e2e8f0; }
    .af-home-stats-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #475569;
      margin-top: 0.2rem;
      display: block;
    }
    .dark .af-home-stats-label { color: #93c5fd; }

    /* Mobile collapsible config panel */
    .pdf-config-shell {
      position: relative;
    }
    .pdf-config-body { transition: all .2s ease; }
    .pdf-config-shell.is-collapsed .pdf-config-body {
      display: none;
    }
    .mobile-collapse-toggle {
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(255,255,255,0.8);
      color: #1558C9;
      border-radius: 9999px;
      width: 2rem;
      height: 2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease;
    }
    .dark .mobile-collapse-toggle {
      background: rgba(15, 23, 42, 0.9);
      border-color: rgba(96, 165, 250, 0.25);
    }
    .pdf-config-shell.is-collapsed .mobile-collapse-toggle {
      transform: rotate(0deg);
    }
    .pdf-config-shell:not(.is-collapsed) .mobile-collapse-toggle {
      transform: rotate(90deg);
    }
    @media (min-width: 768px) {
      .pdf-config-shell .pdf-config-body { display: block !important; }
      .mobile-collapse-toggle { display: none !important; }
    }
    @media (max-width: 767px) {
      .pdf-config-shell {
        border-radius: 1rem;
        overflow: hidden;
      }
      .pdf-config-shell .pdf-config-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body class="min-h-screen">
  <main class="max-w-6xl mx-auto px-4 py-10">
    <header class="mb-8">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-sm font-bold uppercase tracking-[0.2em] text-sapphire-600">WikyFile</p>
          <h1 class="text-3xl font-extrabold">Ảnh sang PDF, PDF sang Word & Chỉnh sửa PDF</h1>
        </div>
        <button type="button" onclick="toggleDarkMode()" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-bold">Sáng/Tối</button>
      </div>
    </header>

    <div class="af-home-stats-shell" aria-label="Thống kê nhanh">
      <div class="af-home-stats-item">
        <span class="af-home-stats-value" id="hero-stat-files">0</span>
        <span class="af-home-stats-label">Trang đã tạo</span>
      </div>
      <div class="af-home-stats-item">
        <span class="af-home-stats-value">100%</span>
        <span class="af-home-stats-label">Riêng tư cục bộ</span>
      </div>
      <div class="af-home-stats-item">
        <span class="af-home-stats-value">4K</span>
        <span class="af-home-stats-label">Độ nét xuất PDF</span>
      </div>
    </div>

    <section class="mt-8 space-y-6">
      <div class="rounded-2xl border border-slate-200 bg-white/80 p-5 shadow-lg">
        <label class="mb-2 block text-sm font-bold text-slate-700">Chọn ảnh để chuyển thành PDF</label>
        <input id="imageInput" type="file" multiple accept="image/*" class="block w-full rounded-xl border border-slate-300 bg-slate-50 p-3" />
      </div>

      <div class="pdf-config-shell is-collapsed" data-config-panel>
        <div class="pdf-config-header flex items-center justify-between rounded-xl border border-slate-200 bg-white/80 p-3">
          <div class="flex items-center gap-2 font-bold text-slate-800">
            <span>⚙️</span>
            <span>Cấu hình File PDF</span>
          </div>
          <button type="button" class="mobile-collapse-toggle" aria-label="Mở/thu gọn cấu hình">›</button>
        </div>
        <div class="pdf-config-body space-y-3 pt-3">
          <div class="grid gap-3 md:grid-cols-3">
            <div>
              <label class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-600">Khổ giấy</label>
              <select class="w-full rounded-xl border border-slate-200 bg-white p-2.5">
                <option>A4</option>
                <option>Letter</option>
                <option>Tự động</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-600">Hướng trang</label>
              <select class="w-full rounded-xl border border-slate-200 bg-white p-2.5">
                <option>Portrait</option>
                <option>Landscape</option>
                <option>Tự động</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text-xs font-bold uppercase tracking-wide text-slate-600">Lề</label>
              <select class="w-full rounded-xl border border-slate-200 bg-white p-2.5">
                <option>0</option>
                <option>5</option>
                <option>10</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const mobileQuery = window.matchMedia('(max-width: 767px)');
      const collapseConfigPanels = () => {
        document.querySelectorAll('[data-config-panel]').forEach((panel) => {
          const isMobile = mobileQuery.matches;
          if (!isMobile) {
            panel.classList.remove('is-collapsed');
            return;
          }
          if (!panel.dataset.initialized) {
            const button = panel.querySelector('.mobile-collapse-toggle');
            if (button) {
              button.addEventListener('click', () => {
                panel.classList.toggle('is-collapsed');
              });
            }
            panel.dataset.initialized = 'true';
          }
          panel.classList.add('is-collapsed');
        });
      };

      collapseConfigPanels();
      if (mobileQuery.addEventListener) {
        mobileQuery.addEventListener('change', collapseConfigPanels);
      } else if (mobileQuery.addListener) {
        mobileQuery.addListener(collapseConfigPanels);
      }

      const filesInput = document.getElementById('imageInput');
      if (filesInput) {
        filesInput.addEventListener('change', function (event) {
          const fileList = Array.from(event.target.files || []);
          const dataTransfer = new DataTransfer();
          fileList.forEach((file) => dataTransfer.items.add(file));
          event.target.files = dataTransfer.files;
          const count = fileList.length;
          const counter = document.getElementById('hero-stat-files');
          if (counter) counter.textContent = String(count);
        });
      }
    });
  </script>
</body>
</html>
